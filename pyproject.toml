[project]
name = "streaming-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-flink==2.1.0",
    "confluent-kafka>=2.16.1",
    "pandas==2.1.4",
    "psycopg2-binary>=2.9.13",
